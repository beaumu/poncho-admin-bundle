name: Eslint

on:
  pull_request:
    paths:
      - '**.js'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/eslint.yaml'

jobs:
  eslint:
    runs-on: ubuntu-24.04

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4

      - name: 'Setup node'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The project is managed with Yarn (packageManager in package.json, yarn.lock committed),
      # not npm — install with the tool that's actually pinned and tested locally.
      - name: 'Enable corepack'
        run: corepack enable

      - name: 'Install dependencies'
        run: yarn install --immutable

      - name: 'eslint'
        run: yarn lint