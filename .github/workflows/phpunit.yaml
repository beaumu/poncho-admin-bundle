name: PhpUnit

# Everything the test kernel loads counts: a config-only change in tests/App
# once broke the Symfony 6.4 leg (pre-2.0) without this workflow ever running.
on:
  push:
    paths:
      - 'src/**'
      - 'config/**'
      - 'templates/**'
      - 'translations/**'
      - 'tests/**'
      - 'composer.json'
      - 'phpunit.xml.dist'
      - '.github/workflows/phpunit.yaml'
  pull_request:
    paths:
      - 'src/**'
      - 'config/**'
      - 'templates/**'
      - 'translations/**'
      - 'tests/**'
      - 'composer.json'
      - 'phpunit.xml.dist'
      - '.github/workflows/phpunit.yaml'

jobs:
  phpunit:
    name: "phpunit - php ${{ matrix.php-version }} / symfony ${{ matrix.symfony-version }}"
    runs-on: ubuntu-24.04
    continue-on-error: false

    strategy:
      matrix:
        php-version: ['8.4']
        # 8.0.x is excluded: symfony/doctrine-bridge's schema listener there calls a DBAL
        # Schema::edit() API that only exists in doctrine/dbal ^4.5, which is not released yet
        # (verified against a clean install — 8.0.15 fails doctrine:schema:create outright,
        # 8.1.7 does not). Add 8.0 back once DBAL 4.5 ships, and 8.2 once it's released.
        symfony-version: ['8.1']
      fail-fast: false

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4

      - name: 'Install PHP with extensions'
        uses: shivammathur/setup-php@v2
        with:
          coverage: none
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, pdo, pdo_sqlite, sqlite3
          ini-values: date.timezone=UTC

      - name: 'Install project dependencies'
        env:
          SYMFONY_REQUIRE: "${{ matrix.symfony-version }}.*"
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require symfony/flex
          composer update --no-interaction --prefer-dist --no-progress
          vendor/bin/simple-phpunit install

      - name: 'Show installed dependencies'
        run: |
          composer show

      - name: 'Run tests'
        env:
          # Fail the build on deprecations triggered by this bundle's own code.
          # Dependency-triggered ones stay tolerated.
          SYMFONY_DEPRECATIONS_HELPER: 'max[self]=0'
        run: vendor/bin/simple-phpunit -v
