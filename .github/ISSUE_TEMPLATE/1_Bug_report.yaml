name: 🐞 Bug Report
description: Report a bug. For a security issue, use the private advisory form instead
labels: [bug]

body:
  - type: input
    id: affected-versions
    attributes:
      label: Poncho version(s) affected
      description: The exact version — `composer show poncho/admin-bundle | grep versions`
      placeholder: 1.2.0
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What you wanted to do, what you expected, and what happened instead. Paste errors and stack traces as text.
    validations:
      required: true

  - type: textarea
    id: how-to-reproduce
    attributes:
      label: How to reproduce
      description: |
        The smallest code and steps that show the bug, with your PHP and Symfony versions.
        Best: a link to a small repository (a fresh Symfony app with the bundle) that reproduces it.
    validations:
      required: true

  - type: textarea
    id: possible-solution
    attributes:
      label: Possible Solution
      description: "Optional: if you have an idea of the cause or a fix, describe it — or open a pull request."

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: "Optional: logs, screenshots, browser and version for JavaScript bugs, etc."
