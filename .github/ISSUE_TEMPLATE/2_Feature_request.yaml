name: 🚀 Feature Request
description: Suggest an idea for this project
labels: [Feature]

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: The problem you want to solve, and the feature you propose for it.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example
      description: |
        A simple example of the new feature in action (include PHP code, YAML config, Twig, etc.)
        If the new feature changes an existing feature, include a simple before/after comparison.
