security:
    password_hashers:
        Poncho\AdminBundle\Tests\App\Entity\AdminUser: 'sodium'

    providers:
        entity_provider:
            entity:
                class: Poncho\AdminBundle\Tests\App\Entity\AdminUser
                property: email

    firewalls:
        main:
            pattern: ^/
            user_checker: Poncho\AdminBundle\Security\UserChecker
            entry_point: Poncho\AdminBundle\Security\AuthenticationEntryPoint
            provider: entity_provider
            lazy: true
            form_login:
                login_path: poncho_admin_login
                check_path: poncho_admin_login
                default_target_path: test.home
                enable_csrf: true
            logout:
                path: poncho_admin_logout
                target: poncho_admin_login
