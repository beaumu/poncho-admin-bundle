framework:
    default_locale: en
    http_method_override: false
    test: true

    # Explicit for clarity; these already match Symfony 8's own defaults.
    handle_all_throwables: true
    php_errors:
        log: true
    validation:
        email_validation_mode: html5

    session:
        handler_id: null
        storage_factory_id: session.storage.factory.mock_file
        cookie_secure: auto
        cookie_samesite: lax
